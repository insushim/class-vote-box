name: Build and release v1.1.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v1.1.3.yml

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Restore prepared source
        shell: pwsh
        run: |
          $encoded = @'

'@
          [IO.File]::WriteAllBytes("class-vote-box-v1.1.3-source.tgz", [Convert]::FromBase64String($encoded))
          tar -xzf class-vote-box-v1.1.3-source.tgz

      - name: Install renderer dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Build desktop renderer
        shell: pwsh
        run: npx vite build --config desktop/vite.config.ts

      - name: Install desktop packager
        shell: pwsh
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Package portable EXE
        shell: pwsh
        working-directory: desktop
        run: npm run package:win

      - name: Create single-file ZIP
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath "desktop/release/우리반투표함.exe" -DestinationPath "default.zip" -Force
          Get-FileHash "default.zip" -Algorithm SHA256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          전자칠판에서 언제든 처음 화면으로 이동할 수 있도록 개선한 버전입니다.

          주요 변경:
          - 투표·개표 결과를 지우지 않고 처음 화면으로 이동
          - 처음 화면에서 투표 계속하기, 개표 결과 보기, 새 투표 준비 선택
          - PIN 확인 직후 개표 완료 상태 저장
          - 개표 도중 종료해도 다음 실행에서 다시 개표를 요구하지 않음
          - 기존 비밀투표, 자동 결선, 모션 개표 기능 유지

          ZIP을 풀고 우리반투표함.exe를 실행하세요.
          "@ | Set-Content -Encoding utf8 release-notes.md
          gh release create v1.1.3 "default.zip" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "우리 반 투표함 v1.1.3" --notes-file release-notes.md --latest
